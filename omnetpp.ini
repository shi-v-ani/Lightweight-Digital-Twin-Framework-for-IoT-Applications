[General]
*.esp32.wlan[0].typename = "Ieee802154NarrowbandInterface"
*.gateway.wlan[0].typename = "Ieee802154NarrowbandInterface"
network = MiotNetwork
sim-time-limit = 100s

*.configurator.config = xml("<config><interface hosts='esp32' names='wlan0' address='10.0.0.1' netmask='255.255.255.0'/><interface hosts='gateway' names='wlan0' address='10.0.0.2' netmask='255.255.255.0'/></config>")

*.esp32.numApps = 1
*.esp32.app[0].typename = "TemperatureSensor"
*.esp32.app[0].destAddress = "10.0.0.2"

*.gateway.numApps = 1
*.gateway.app[0].typename = "UdpSink"
*.gateway.app[0].localPort = 5000

[Config Stable]
*.esp32.app[0].sendInterval = 1s

[Config Lightweight]
*.esp32.app[0].sendInterval = 5s